name: Chrono Crawler Production PR CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: production-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production boot
        run: npx playwright test tests/smoke/00-production-boot.spec.ts

      - name: Verify release-gate regressions
        run: npx playwright test tests/smoke/hotel-traversal.spec.ts tests/smoke/memory-artifacts.spec.ts --workers=1 --max-failures=1

      - name: Run smoke and visual QA
        run: npm run test:smoke

      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folded-reactor-visual-qa
          path: artifacts/visual
          if-no-files-found: warn

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folded-reactor-playwright-diagnostics
          path: test-results
          if-no-files-found: warn